{% extends "base.html" %}
{% block title %}Change Password — DocConnect{% endblock %}

{% block content %}
<div style="max-width:480px;margin:40px auto;padding:0 16px">
  {% if messages %}
    {% for msg in messages %}
    <div style="padding:12px 16px;border-radius:6px;margin-bottom:16px;{% if 'success' in msg.tags %}background:#e6f4ea;color:#057642;border-left:4px solid #057642{% else %}background:#fce8e6;color:#cc1016;border-left:4px solid #cc1016{% endif %}">
      {{ msg }}
    </div>
    {% endfor %}
  {% endif %}
  <div class="card">
    <div style="padding:16px 20px;border-bottom:1px solid var(--border)">
      <div style="font-size:17px;font-weight:700">🔒 Change Password</div>
      <div style="font-size:13px;color:var(--muted);margin-top:2px">Update password for {{ request.user.phone }}</div>
    </div>
    <form method="post" style="padding:20px">
      {% csrf_token %}
      <div style="margin-bottom:16px">
        <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">Current Password</label>
        <input type="password" name="current_password" required style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:5px;font-size:14px;outline:none" onfocus="this.style.borderColor='#0a66c2'" onblur="this.style.borderColor='var(--border)'">
      </div>
      <div style="margin-bottom:16px">
        <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">New Password</label>
        <input type="password" name="new_password" required minlength="8" style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:5px;font-size:14px;outline:none" onfocus="this.style.borderColor='#0a66c2'" onblur="this.style.borderColor='var(--border)'">
      </div>
      <div style="margin-bottom:24px">
        <label style="display:block;font-size:13px;font-weight:600;margin-bottom:6px">Confirm New Password</label>
        <input type="password" name="confirm_password" required minlength="8" style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:5px;font-size:14px;outline:none" onfocus="this.style.borderColor='#0a66c2'" onblur="this.style.borderColor='var(--border)'">
      </div>
      <div style="display:flex;gap:10px">
        <button type="submit" style="padding:9px 24px;background:var(--blue);color:#fff;border:none;border-radius:20px;font-size:14px;font-weight:600;cursor:pointer">Update Password</button>
        <a href="/settings/?tab=security" style="padding:9px 20px;background:#f3f2ef;color:#333;border-radius:20px;font-size:14px;font-weight:600;text-decoration:none">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
